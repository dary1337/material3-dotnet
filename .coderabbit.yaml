language: en-US
early_access: false
enable_free_tier: true

tone_instructions: "Ruthless principal reviewing a public pre-1.0 Material 3 library: Core (netstandard2.0), WinForms and WPF (net472+net8). Terse, no nits. Prioritize correctness, leaks, DPI, theming, threading, tests. Never ask for code comments."

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  sequence_diagrams: false
  changed_files_summary: true
  abort_on_close: true

  # CS1591 fails the build, so the compiler already enforces doc coverage.
  pre_merge_checks:
    docstrings:
      mode: "off"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true
    base_branches:
      - main
      - release/.*
    ignore_title_keywords:
      - WIP
      - "[skip review]"

  path_filters:
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/artifacts/**"
    - "!**/*.Designer.cs"
    - "!**/*.designer.cs"
    - "!**/*.resx"
    - "!**/Resources/icons/**"
    - "!**/CompatibilitySuppressions.xml"

  path_instructions:
    - path: "src/**"
      instructions: >
        Pre-1.0 (0.x) semver: a breaking public API change ships in a MINOR bump and is intended. Never ask for
        [Obsolete] forwarders, compatibility shims, restored old names or restored parameter names, and never ask
        for release notes in a PR — they are written at release time. A PATCH bump must carry no break at all: flag
        that. Every break must be listed in that package's CompatibilitySuppressions.xml; the pack step's API
        validation already fails CI otherwise, so do not re-check the file. Code comments are WHY-only and rare;
        XML docs are mandatory on every public member (CS1591 is a build error) — never request descriptive
        comments, and never request docs that restate the member name.

    - path: "src/Material3.Core/**/*.cs"
      instructions: >
        UI-agnostic netstandard2.0 engine: no System.Drawing, System.Windows or WinForms reference, colour is the
        neutral Argb struct. Colour science is a port of material-color-utilities (CAM16/HCT/sRGB/tonal palettes):
        any change to a constant, matrix coefficient, sign, clamp or hue wrap must preserve numeric fidelity with
        the reference and come with a test. Guard NaN propagation, division by zero, gamut clamping, ARGB byte
        order and hue mod 360. Numeric parsing and formatting use InvariantCulture.

    - path: "src/Material3.WinForms/**/*.cs"
      instructions: >
        Dependency-free, net472 + net8.0-windows, nullable enabled. Flag any new PackageReference and any API or
        language construct unavailable on net472. Dispose every IDisposable created locally (Pen/Brush/
        GraphicsPath/Font/StringFormat/Region/Bitmap/Graphics) in the same scope — EXCEPT bitmaps returned by
        MaterialIconRenderer.Render, which are shared cache entries nobody disposes. StringComparison.Ordinal for
        keys and identifiers, InvariantCulture for numeric/SVG parsing, CurrentCulture only for user-facing text.
        No hardcoded colour hex — read MaterialColors/ThemeManager; no magic geometry — use the Tokens
        (Shape/Spacing/ComponentSizes/StateLayers/Motion/Elevation).

    - path: "src/Material3.WinForms/Controls/**/*.cs"
      instructions: >
        Owner-drawn controls. Pen/Brush/GraphicsPath/Font/StringFormat/Region/Bitmap created in OnPaint or a paint
        helper are disposed in the same scope; bitmaps from MaterialIconRenderer.Render are shared and must NOT be
        disposed. SetStyle in the ctor must match the paint strategy (UserPaint + SupportsTransparentBackColor ⇒
        OnPaint paints the full ClientRectangle). DPI: scale FIXED sub-element sizes via Dpi.Scale(this, …); never
        scale values derived from Width/Height/ClientRectangle nor sizes assigned in the ctor — EXCEPT a control
        with an intrinsic fixed height, which self-sizes from DeviceDpi in OnHandleCreated + OnDpiChangedAfterParent
        because runtime-added controls never get AutoScale. Paint geometry and hit-testing use the same scaled math.
        Dpi.Scale is identity at 96 DPI, so nothing may change 100% rendering. Theme: subscribe via ThemeHook.Attach
        and read colours live from MaterialColors at paint. Designer: public parameterless ctor; runtime/computed
        properties get [Browsable(false)] + [DesignerSerializationVisibility(Hidden)]; settable ones get
        [DefaultValue] matching the parameterless ctor; timers and handle work stay behind DesignMode. Dispose timers
        and detach handlers whose target outlives the control.

    - path: "src/Material3.WinForms/Theming/**/*.cs"
      instructions: >
        Thin adapters over Material3.Core (ArgbExtensions.ToGdi/ToCore) plus the WinForms ThemeManager; the colour
        math itself lives in Core. ThemeManager holds mutable static state: flag non-atomic reads of theme + mode
        and any ThemeChanged subscription without a matching unsubscribe.

    - path: "src/Material3.WinForms/Drawing/**/*.cs"
      instructions: >
        MaterialIconRenderer/SvgGlyph. Returned bitmaps are shared: callers never dispose them, and Register drops
        the key's stale bitmaps from the cache WITHOUT disposing them, because a control may still be showing one —
        do not ask for that Dispose. The cache key includes every render input (key, size, colour) and every cache
        mutation happens under lock(Gate). SvgGlyph parses with InvariantCulture; a missing or malformed path
        degrades to blank rather than throwing into a paint. Guard a zero-area viewBox.

    - path: "src/Material3.WinForms/Forms/**/*.cs"
      instructions: >
        BorderlessForm Win32: WM_NCHITTEST/WM_NCCALCSIZE handling and the HTTRANSPARENT cascade stay intact;
        caption geometry scales with DPI. MaterialDialog sets DialogResult deterministically. CalendarMath/TimeMath:
        leap years, AM/PM, hour 0/12, month/year edges — logic changes need tests. MaterialMessageBox stays generic.

    - path: "src/Material3.WinForms/MaterialCursors.cs"
      instructions: >
        LoadCursor(NULL, IDC_*) returns SHARED OS cursor handles: cursors stay static, are never disposed, and get no
        DestroyCursor. Do not re-add Cursors.* aliases — the point is the user's current scheme.

    - path: "src/Material3.Wpf/**/*.cs"
      instructions: >
        Lookless WPF controls, net472 + net8.0-windows. Flag: a direct assignment to a dependency property a
        consumer may have bound or styled (use SetCurrentValue, or SetResourceReference for theme brushes);
        FindResource/TryFindResource for a theme colour (ThemeManager REPLACES role brushes on a switch, so use
        SetResourceReference/DynamicResource); a storyboard, clock or RepeatBehavior.Forever animation that is not
        stopped on Unloaded or when its state ends; a Brush/Geometry/Transform created in code and never mutated
        afterwards but not frozen; an animation that bypasses Motion's durations, so Motion.AnimationsEnabled and
        the system animation setting no longer turn it off; a static field holding a mutable, thread-affine WPF
        object that is not [ThreadStatic] (frozen Freezables may be shared statics); a template part used without
        a null check.

    - path: "src/Material3.Wpf/**/*.xaml"
      instructions: >
        Colours come from theme roles via DynamicResource, never literals or StaticResource of a role brush. Every
        interactive template has an IsEnabled=False trigger (M3 disabled: 0.38 content opacity, no state layer) and
        a keyboard focus visual (M3FocusRing). Template parts keep their PART_ names in sync with [TemplatePart]
        attributes. Storyboards that loop are stopped by an exit action.

    - path: "tests/**/*.cs"
      instructions: >
        Changes to geometry, colour math, parsing, input filtering or calendar/time logic must add or extend a test.
        Reject weakened assertions and tests narrowed just to pass. Whether cases are a Theory or separate Facts is
        the author's call — never a finding. WPF UI tests must not depend on machine settings (DPI, the system
        animation setting) or on test order.

    - path: "samples/Material3.WinForms.Gallery/**/*.cs"
      instructions: >
        Demo / smoke-test app, not shipped — lower rigor than the library, but still flag real bugs, GDI+/event
        leaks and DPI layout regressions. The gallery exercises every control in light and dark; flag a new public
        control with no gallery page. Gallery layout helpers may scale via Dpi.Scale.

    - path: "samples/Material3.Wpf.Gallery/**"
      instructions: >
        Demo / smoke-test app, not shipped — lower rigor than the library, but still flag real WPF bugs: timers,
        storyboards or animations not stopped on teardown; event or binding leaks; a local resource whose x:Key
        shadows a library style. The gallery exercises Modal, Dialog, AnimatedPopup and navigation in light and
        dark; flag a new public WPF control with no gallery page. Comments are allowed here as examples.

    - path: "**/*.csproj"
      instructions: >
        No new external dependency (framework references only); PackageReference versions pinned. Target
        frameworks: Material3.Core is netstandard2.0, the UI packages are net472;net8.0-windows — preserve them.
        Each package versions independently. A release split across several PRs into a release/* branch bumps
        versions in its last PR, so a missing or version-only bump in a release/* PR is not a finding.
        PackageValidationBaselineVersion is the package's own last published version. Package metadata
        (PackageId, license, RepositoryUrl, PackageReadmeFile) stays intact.

    - path: ".github/workflows/**/*.yml"
      instructions: >
        One workflow builds with -warnaserror, tests and packs on every push and PR, then publishes on a push to
        main: a package publishes when its <Version> is above its last tag <PackageId>/vX.Y.Z (the old shared vX.Y.Z
        counts before the first one), and CI creates that tag itself. Each publishing run makes ONE GitHub release
        vX.Y.Z (the highest version it published) carrying every package and both galleries. Check that a failed push, tag push or release
        stops the run, that an existing version is never republished, and that a UI package cannot publish while
        Core has unreleased code. Actions pinned by major version or SHA, never @latest; secrets only via
        secrets.* or OIDC; no pull_request_target with a PR-head checkout; permissions minimal. A pwsh step ends
        with the last native command's exit code — a non-zero one left over fails the step.

    - path: "**/*.md"
      instructions: >
        Public docs: flag API names that no longer exist in the code and examples that would not compile. No
        internal consumer names, local paths or measurements from private runs.

  labeling_instructions:
    - label: "breaking-change"
      instructions: "Apply when a public type/member signature is renamed, removed, retyped, or has its parameters changed."
    - label: "new-dependency"
      instructions: "Apply when a PackageReference is added to a library project or its transitive surface grows."
    - label: "dpi"
      instructions: "Apply when Dpi.Scale, OnHandleCreated/OnDpiChangedAfterParent sizing, or owner-drawn geometry changes."
    - label: "gdi-leak"
      instructions: "Apply when OnPaint or paint helpers create Pen/Brush/GraphicsPath/Font/Region/Bitmap without disposal."
    - label: "theming"
      instructions: "Apply when Core's colour pipeline, ColorScheme, MaterialColors or either ThemeManager changes."
    - label: "needs-tests"
      instructions: "Apply when geometry/colour/parsing/calendar logic changes without matching test coverage."

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto

code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "src/**/*.cs"
        instructions: >
          Every public type and member carries an XML doc (CS1591 is a build error): one concise summary that aids
          IntelliSense. Never echo the symbol name, never narrate the implementation, never document private members
          or overrides the base already documents. Document the why (constraints, invariants, units, gotchas).
