name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Release plan
        id: plan
        shell: pwsh
        run: |
          $packages = @(
            @{ Id = 'Material3.Core'; Dir = 'src/Material3.Core'; UsesCore = $false },
            @{ Id = 'Material3.WinForms'; Dir = 'src/Material3.WinForms'; UsesCore = $true },
            @{ Id = 'Material3.Wpf'; Dir = 'src/Material3.Wpf'; UsesCore = $true }
          )
          function TagVersion([string]$tag) { [version]$tag.Substring($tag.LastIndexOf('v') + 1) }
          function LastTag([string]$id) {
            $own = @(git tag -l "$id/v*") | Sort-Object { TagVersion $_ } | Select-Object -Last 1
            if ($own) { return $own }
            return @(git tag -l 'v*') | Sort-Object { TagVersion $_ } | Select-Object -Last 1
          }
          $plan = foreach ($p in $packages) {
            $version = (([xml](Get-Content "$($p.Dir)/$($p.Id).csproj")).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
            $last = LastTag $p.Id
            if ($last -and [version]$version -lt (TagVersion $last)) { throw "$($p.Id) $version is older than its last release $last." }
            git -c core.safecrlf=false diff --quiet $last -- $p.Dir ":(exclude)$($p.Dir)/*.csproj"
            [pscustomobject]@{
              Id = $p.Id; Version = $version; Tag = "$($p.Id)/v$version"; LastTag = $last
              Publish = -not ($last -and (TagVersion $last) -ge [version]$version)
              Changed = $LASTEXITCODE -ne 0; UsesCore = $p.UsesCore
            }
          }
          foreach ($p in $plan | Where-Object { $_.Changed -and -not $_.Publish }) {
            Write-Host "::warning::$($p.Id) has changes since $($p.LastTag) that stay unreleased until its <Version> is bumped."
          }
          $core = $plan | Where-Object Id -eq 'Material3.Core'
          $blocked = @($plan | Where-Object { $_.UsesCore -and $_.Publish } | ForEach-Object Id)
          if ($core.Changed -and -not $core.Publish -and $blocked.Count -gt 0) {
            throw "Material3.Core changed since $($core.LastTag) but stays $($core.Version), so $($blocked -join ', ') cannot be published. Bump Material3.Core."
          }
          $plan | Format-Table Id, Version, LastTag, Changed, Publish -AutoSize | Out-String | Write-Host
          ConvertTo-Json -InputObject @($plan) | Set-Content "$env:RUNNER_TEMP/plan.json"
          "publish=$(([bool]($plan | Where-Object Publish)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Material3.sln
      - name: Build (net472 + net8.0-windows)
        run: dotnet build Material3.sln -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test Material3.sln -c Release --no-build

      - name: Pack
        shell: bash
        run: |
          dotnet pack src/Material3.Core/Material3.Core.csproj -c Release --no-build -o artifacts
          dotnet pack src/Material3.WinForms/Material3.WinForms.csproj -c Release --no-build -o artifacts
          dotnet pack src/Material3.Wpf/Material3.Wpf.csproj -c Release --no-build -o artifacts

      - name: NuGet login (OIDC trusted publishing)
        if: github.event_name != 'pull_request' && steps.plan.outputs.publish == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: dary1337

      - name: Publish, tag and release
        if: github.event_name != 'pull_request' && steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $galleries = @(
            'samples/Material3.WinForms.Gallery/bin/Release/net472/Material3.WinForms.Gallery.exe',
            'samples/Material3.Wpf.Gallery/bin/Release/net472/Material3.Wpf.Gallery.exe'
          )
          $plan = Get-Content "$env:RUNNER_TEMP/plan.json" -Raw | ConvertFrom-Json
          foreach ($p in $plan | Where-Object Publish) {
            $nupkg = "artifacts/$($p.Id).$($p.Version).nupkg"
            dotnet nuget push $nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($p.Id)" }
            git tag $p.Tag
            git push origin $p.Tag
            gh release create $p.Tag --title "$($p.Id) $($p.Version)" --generate-notes --notes-start-tag $p.LastTag @galleries $nupkg
            if ($LASTEXITCODE -ne 0) { throw "Release failed for $($p.Id)" }
          }
