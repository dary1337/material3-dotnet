name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Release plan
        id: plan
        shell: pwsh
        run: |
          $packages = @(
            @{ Id = 'Material3.Core'; Dir = 'src/Material3.Core'; UsesCore = $false },
            @{ Id = 'Material3.WinForms'; Dir = 'src/Material3.WinForms'; UsesCore = $true },
            @{ Id = 'Material3.Wpf'; Dir = 'src/Material3.Wpf'; UsesCore = $true }
          )
          function Published([string]$id) {
            try { $all = (Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$($id.ToLowerInvariant())/index.json").versions }
            catch { if ([int]$_.Exception.Response.StatusCode -eq 404) { $all = @() } else { throw } }
            @($all | Where-Object { $_ -match '^\d+(\.\d+){1,3}$' } | ForEach-Object { [version]$_ })
          }
          $lastRelease = @(git tag -l 'v*' --sort=-creatordate) | Select-Object -First 1
          $plan = foreach ($p in $packages) {
            $version = (([xml](Get-Content "$($p.Dir)/$($p.Id).csproj")).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
            $published = Published $p.Id
            $latest = $published | Sort-Object | Select-Object -Last 1
            if ($latest -and [version]$version -lt $latest) { throw "$($p.Id) $version is older than its published $latest." }
            $changes = @(git -c core.safecrlf=false diff --name-only $lastRelease -- $p.Dir ":(exclude)$($p.Dir)/*.csproj")
            [pscustomobject]@{
              Id = $p.Id; Version = $version; Latest = "$latest"
              Publish = -not ($published -contains [version]$version)
              Changed = $changes.Count -gt 0; UsesCore = $p.UsesCore
            }
          }
          foreach ($p in $plan | Where-Object { $_.Changed -and -not $_.Publish }) {
            Write-Host "::warning::$($p.Id) has changes since $lastRelease that stay unreleased until its <Version> is bumped."
          }
          $core = $plan | Where-Object Id -eq 'Material3.Core'
          $blocked = @($plan | Where-Object { $_.UsesCore -and $_.Publish } | ForEach-Object Id)
          if ($core.Changed -and -not $core.Publish -and $blocked.Count -gt 0) {
            throw "Material3.Core changed since $lastRelease but stays $($core.Version), so $($blocked -join ', ') cannot be published. Bump Material3.Core."
          }
          $plan | Format-Table Id, Version, Latest, Changed, Publish -AutoSize | Out-String | Write-Host
          ConvertTo-Json -InputObject @($plan) | Set-Content "$env:RUNNER_TEMP/plan.json"
          "publish=$(([bool]($plan | Where-Object Publish)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Material3.sln
      - name: Build (net472 + net8.0-windows)
        run: dotnet build Material3.sln -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test Material3.sln -c Release --no-build

      - name: Pack
        shell: bash
        run: |
          dotnet pack src/Material3.Core/Material3.Core.csproj -c Release --no-build -o artifacts
          dotnet pack src/Material3.WinForms/Material3.WinForms.csproj -c Release --no-build -o artifacts
          dotnet pack src/Material3.Wpf/Material3.Wpf.csproj -c Release --no-build -o artifacts

      - name: NuGet login (OIDC trusted publishing)
        if: github.event_name != 'pull_request' && steps.plan.outputs.publish == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: dary1337

      - name: Publish, tag and release
        if: github.event_name != 'pull_request' && steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $galleries = @(
            'samples/Material3.WinForms.Gallery/bin/Release/net472/Material3.WinForms.Gallery.exe',
            'samples/Material3.Wpf.Gallery/bin/Release/net472/Material3.Wpf.Gallery.exe'
          )
          $plan = Get-Content "$env:RUNNER_TEMP/plan.json" -Raw | ConvertFrom-Json
          $published = @($plan | Where-Object Publish)
          $version = ($published | ForEach-Object { [version]$_.Version } | Sort-Object | Select-Object -Last 1).ToString()
          $release = "v$version"
          if (git tag -l $release) { throw "Release $release already exists: bump a package above $version." }
          $previous = @(git tag -l 'v*' --sort=-creatordate) | Select-Object -First 1
          foreach ($p in $published) {
            dotnet nuget push "artifacts/$($p.Id).$($p.Version).nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($p.Id)" }
          }
          git tag $release
          git push origin $release
          if ($LASTEXITCODE -ne 0) { throw "Tag push failed for $release" }
          $notesFrom = if ($previous) { @('--notes-start-tag', $previous) } else { @() }
          $packages = @(Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object FullName)
          gh release create $release --verify-tag --title "Material3 for .NET $version" --generate-notes @notesFrom @galleries @packages
          if ($LASTEXITCODE -ne 0) { throw "Release failed for $release" }
